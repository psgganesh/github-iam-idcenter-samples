
name: Trigger Argo Workflow using OIDC IAM Role

on:
  push:
    branches: [main]


permissions:
  id-token: write
  contents: read


jobs:
  trigger-argo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v5

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: ap-southeast-2
          role-to-assume: ${{ secrets.AWS_IAM_ROLE }}
          role-session-name: ShortLivedGithubActionSession

      - name: Test AWS Credentials
        run: aws sts get-caller-identity

      - name: Update kubeconfig dynamically
        run: aws eks update-kubeconfig --name northstar --region ap-southeast-2

      - name: Install Argo CLI
        run: |
          curl -sLO https://github.com/argoproj/argo-workflows/releases/latest/download/argo-linux-amd64.gz
          gunzip argo-linux-amd64.gz
          chmod +x argo-linux-amd64
          sudo mv argo-linux-amd64 /usr/local/bin/argo

      - name: Verify connectivity
        run: |
          kubectl get workflows -n argo
          argo list -n argo

      - name: Submit Argo Workflow
        run: |
          argo submit workflow.yaml \
            -n argo \
            -p git-sha=${{ github.sha }} \
            -p branch=${{ github.ref_name }} \
            --wait

