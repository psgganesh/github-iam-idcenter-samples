name: IAM Policy Validation

on:
  push:
    branches: [ "dev/opa" ]

jobs:
  validate-iam-policies:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Source
        uses: actions/checkout@v6
      
      - name: Download OPA
        uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: latest # install the latest version

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init & Plan
        run: |
          cd terraform/
          terraform init
          terraform plan -out=tfplan
          terraform show -json tfplan > tfplan.json

      - name: Extract IAM Policies from Plan
        run: |
          python3 -c "
          import json, os
          with open('terraform/tfplan.json') as f:
              plan = json.load(f)
          os.makedirs('opa_inputs', exist_ok=True)
          for rc in plan.get('resource_changes', []):
              if rc['type'] in ('aws_iam_policy', 'aws_iam_role_policy'):
                  after = rc.get('change', {}).get('after', {})
                  policy_doc = json.loads(after.get('policy', '{}'))
                  if policy_doc.get('Statement'):
                      filename = rc['address'].replace('.', '_') + '.json'
                      with open(f'opa_inputs/{filename}', 'w') as out:
                          json.dump(policy_doc, out, indent=2)
                      print(f'Extracted: {filename}')
          "

      - name: Run OPA Policy Checks
        run: |
          echo "=== Running OPA IAM Policy Validation ==="
          FAILED=0
          for policy_file in opa_inputs/*.json; do
            if [ -f "$policy_file" ]; then
              echo ""
              echo "--- Evaluating: $policy_file ---"
              RESULT=$(opa eval -i "$policy_file" -d policies/ "data.iam.result" --format pretty)
              echo "$RESULT"
              if echo "$RESULT" | grep -q '"permit": false'; then
                echo "FAILED: $policy_file violates IAM policy guardrails"
                FAILED=1
              else
                echo "PASSED: $policy_file"
              fi
            fi
          done
          echo ""
          echo "=== Validation Complete ==="
          if [ $FAILED -eq 1 ]; then
            echo "One or more IAM policies violate organisational security rules."
            exit 1
          fi
          echo "All IAM policies are compliant."
